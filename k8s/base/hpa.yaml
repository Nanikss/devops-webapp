apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: feature-flags
  labels:
    app.kubernetes.io/name: feature-flags
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: feature-flags
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Avoid flapping: wait 5 minutes of low load before removing pods.
      stabilizationWindowSeconds: 300
