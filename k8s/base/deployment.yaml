apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-flags
  labels:
    app.kubernetes.io/name: feature-flags
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: feature-flags
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the desired count during a rollout: a new pod must be
      # Ready before an old one is removed.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: feature-flags
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: feature-flags
      containers:
        - name: app
          image: ghcr.io/nanikss/devops-webapp
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: FLAGS_FILE
              value: /etc/feature-flags/flags.json
            - name: LOG_LEVEL
              value: info
            # Time between failing readiness and closing the server, so the
            # Service endpoints and ingress stop routing here first.
            - name: SHUTDOWN_DELAY_MS
              value: "5000"
          # Gives the app up to 60s to start before liveness takes over.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: flags
              mountPath: /etc/feature-flags
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: flags
          configMap:
            name: feature-flags-config
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
