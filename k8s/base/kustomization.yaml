apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No namespace here on purpose: each overlay owns its namespace.
resources:
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - ingress.yaml

# Generated ConfigMap gets a content hash in its name (feature-flags-config-<hash>).
# Kustomize rewrites the reference in the Deployment, so changing flags.json
# changes the pod template and triggers a normal rolling update.
configMapGenerator:
  - name: feature-flags-config
    files:
      - flags.json

labels:
  - pairs:
      app.kubernetes.io/part-of: devops-webapp
